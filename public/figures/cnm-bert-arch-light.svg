<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family="Geist, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><rect width="760" height="240" fill="none"/><text x="0.0" y="22.0" font-size="16" fill="#24292f" font-weight="600" text-anchor="start">Where the structure enters the model</text><text x="0.0" y="42.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">The backbone, the vocabulary, and the output head are untouched, so it drops into an existing pipeline.</text><rect x="0" y="74" width="170" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="85.0" y="98.0" font-size="13" fill="#24292f" font-weight="600" text-anchor="middle">Character</text><text x="85.0" y="116.0" font-size="11" fill="#57606a" font-weight="400" text-anchor="middle">e.g. 樹</text><line x1="176" y1="101" x2="194" y2="101" stroke="#8c959f" stroke-width="1.5"/><path d="M193,97 L200,101 L193,105" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="200" y="62" width="190" height="34" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="295.0" y="83.0" font-size="13" fill="#24292f" font-weight="600" text-anchor="middle">Token embedding</text><rect x="200" y="106" width="190" height="34" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/><text x="295.0" y="127.0" font-size="13" fill="#24292f" font-weight="600" text-anchor="middle">Tree-MLP over IDS</text><path d="M396,79 L410,79 Q418,79 418,87 L418,115 Q418,123 410,123 L396,123" fill="none" stroke="#8c959f" stroke-width="1.5"/><line x1="418" y1="101" x2="436" y2="101" stroke="#8c959f" stroke-width="1.5"/><path d="M435,97 L442,101 L435,105" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="442" y="74" width="140" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="512.0" y="98.0" font-size="13" fill="#24292f" font-weight="600" text-anchor="middle">Fusion</text><text x="512.0" y="116.0" font-size="11" fill="#57606a" font-weight="400" text-anchor="middle">LayerNorm</text><line x1="588" y1="101" x2="606" y2="101" stroke="#8c959f" stroke-width="1.5"/><path d="M605,97 L612,101 L605,105" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="612" y="74" width="148" height="54" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/><text x="686.0" y="98.0" font-size="13" fill="#24292f" font-weight="600" text-anchor="middle">BERT</text><text x="686.0" y="116.0" font-size="11" fill="#57606a" font-weight="400" text-anchor="middle">unchanged</text><text x="0.0" y="170.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">Structure is symbolic and computed once per unique character per batch, so training costs about 5% more.</text><text x="0.0" y="192.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">An out-of-vocabulary character still carries its components, which is why the gap widens on rare characters.</text></svg>