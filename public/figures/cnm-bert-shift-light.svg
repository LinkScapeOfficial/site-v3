<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Geist, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img"><rect width="760" height="300" fill="none"/><text x="0.0" y="22.0" font-size="16" fill="#24292f" font-weight="600" text-anchor="start">The advantage grows as the data gets harder</text><text x="0.0" y="42.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">Structure F1 gained over the strongest baseline, by split.</text><text x="0.0" y="60.0" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">A widening gap is the signature of an architectural prior rather than a scaling artefact.</text><line x1="0" y1="260" x2="720" y2="260" stroke="#d0d7de" stroke-width="1"/><path d="M60.0,260.0 L60.0,243.7 Q60.0,239.7 64.0,239.7 L148.0,239.7 Q152.0,239.7 152.0,243.7 L152.0,260.0 Z" fill="#0969da"/><text x="106.0" y="227.7" font-size="20" fill="#24292f" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace">+1.3</text><text x="106.0" y="280.0" font-size="12" fill="#57606a" font-weight="400" text-anchor="middle">In-distribution</text><path d="M250.0,260.0 L250.0,201.5 Q250.0,197.5 254.0,197.5 L338.0,197.5 Q342.0,197.5 342.0,201.5 L342.0,260.0 Z" fill="#0969da"/><text x="296.0" y="185.5" font-size="20" fill="#24292f" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace">+4.0</text><text x="296.0" y="280.0" font-size="12" fill="#57606a" font-weight="400" text-anchor="middle">Long tail</text><path d="M440.0,260.0 L440.0,110.8 Q440.0,106.8 444.0,106.8 L528.0,106.8 Q532.0,106.8 532.0,110.8 L532.0,260.0 Z" fill="#0969da"/><text x="486.0" y="94.8" font-size="20" fill="#24292f" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace">+9.8</text><text x="486.0" y="280.0" f